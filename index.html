        }
        .container {

        function generateRandomTraps(level) {
            if (!level.randomTraps) return;
            
            level.traps = [];
            const used = new Set();
            used.add(`${level.start.x},${level.start.y}`);
            used.add(`${level.goal.x},${level.goal.y}`);
            level.gems.forEach(g => used.add(`${g.x},${g.y}`));
            
            let attempts = 0;
            while (level.traps.length < level.randomTraps && attempts < 100) {
                const x = Math.floor(Math.random() * level.grid);
                const y = Math.floor(Math.random() * level.grid);
                const key = `${x},${y}`;
                
                if (!used.has(key)) {
                    level.traps.push({x, y});
                    used.add(key);
                }
                attempts++;
            }
        }

        function parseCommands(input) {
            const result = [];
            const str = input.toUpperCase().replace(/[\s,]/g, '');
            
            let i = 0;
            while (i < str.length) {
                if (str[i] === 'X') {
                    let numStr = '';
                    i++;
                    
                    while (i < str.length && str[i] >= '0' && str[i] <= '9') {
                        numStr += str[i];
                        i++;
                    }
                    
                    const reps = parseInt(numStr);
                    
                    if (i < str.length && str[i] === '{') {
                        i++;
                        let content = '';
                        let braces = 1;
                        
                        while (i < str.length && braces > 0) {
                            if (str[i] === '{') braces++;
                            else if (str[i] === '}') braces--;
                            
                            if (braces > 0) content += str[i];
                            i++;
                        }
                        
                        const innerCmds = parseSimple(content);
                        result.push({type: 'loop', reps: reps, cmds: innerCmds});
                    }
                }
                else if (['D', 'I', 'A', 'B'].includes(str[i])) {
                    result.push({type: 'cmd', cmd: str[i]});
                    i++;
                }
                else {
                    i++;
                }
            }
            
            return result;
        }

        function parseSimple(str) {
            const cmds = [];
            for (let i = 0; i < str.length; i++) {
                if (['D', 'I', 'A', 'B'].includes(str[i])) {
                    cmds.push(str[i]);
                }
            }
            return cmds;
        }

        async function executeCommands(parsedCmds) {
            if (game.executing) return;
            
            game.executing = true;
            game.currentLevelTime = Date.now();
            const level = levels[game.currentLevel];
            
            game.pos = {...level.start};
            game.gems = [];
            game.energy = level.maxEnergy;
            
            render();
            
            for (let i = 0; i < parsedCmds.length; i++) {
                const item = parsedCmds[i];
                
                if (item.type === 'loop') {
                    for (let r = 0; r < item.reps; r++) {
                        if (game.energy <= 0) {
                            showFeedback('error', '⚡ Sin energía - NECESITAS BUCLE');
                            game.executing = false;
                            game.attempts++;
                            return;
                        }
                        
                        game.energy--;
                        
                        for (let c = 0; c < item.cmds.length; c++) {
                            const result = await executeMove(item.cmds[c]);
                            if (!result) {
                                game.executing = false;
                                game.attempts++;
                                return;
                            }
                        }
                    }
                } else {
                    if (game.energy <= 0) {
                        showFeedback('error', '⚡ Sin energía - NECESITAS BUCLE');
                        game.executing = false;
                        game.attempts++;
                        return;
                    }
                    
                    game.energy--;
                    const result = await executeMove(item.cmd);
                    if (!result) {
                        game.executing = false;
                        game.attempts++;
                        return;
                    }
                }
            }
            
            checkWin();
            game.executing = false;
        }

        async function executeMove(cmd) {
            const level = levels[game.currentLevel];
            const newPos = {...game.pos};
            
            switch(cmd) {
                case 'D': newPos.x++; break;
                case 'I': newPos.x--; break;
                case 'A': newPos.y--; break;
                case 'B': newPos.y++; break;
            }
            
            if (newPos.x < 0 || newPos.x >= level.grid || newPos.y < 0 || newPos.y >= level.grid) {
                showFeedback('error', '🚫 Fuera de límites');
                return false;
            }
            
            if (level.traps.some(t => t.x === newPos.x && t.y === newPos.y)) {
                game.pos = newPos;
                render();
                await sleep(200);
                showFeedback('error', '💀 Caíste en un portal');
                return false;
            }
            
            game.pos = newPos;
            
            for (let g = 0; g < level.gems.length; g++) {
                if (level.gems[g].x === newPos.x && level.gems[g].y === newPos.y && !game.gems.includes(g)) {
                    game.gems.push(g);
                    break;
                }
            }
            
            render();
            await sleep(200);
            return true;
        }

        function checkWin() {
            const level = levels[game.currentLevel];
            
            if (game.pos.x === level.goal.x && game.pos.y === level.goal.y && game.gems.length === level.gems.length) {
                const timeBonus = Math.max(0, 500 - game.attempts * 50);
                const energyBonus = game.energy * 20;
                const levelScore = level.points + timeBonus + energyBonus;
                
                game.totalScore += levelScore;
                game.completed = true;
                game.attempts = 0;
                
                showFeedback('success', `🎉 +${levelScore} pts | Nivel ${level.id} completado!`);
                render();
            } else {
                let msg = '';
                if (game.pos.x !== level.goal.x || game.pos.y !== level.goal.y) {
                    msg = 'No llegaste a la meta';
                } else {
                    msg = `Faltan ${level.gems.length - game.gems.length} gemas`;
                }
                showFeedback('error', '❌ ' + msg);
                game.attempts++;
            }
        }

        function showFeedback(type, msg) {
            const fb = document.getElementById('feedback');
            if (fb) {
                fb.className = `feedback ${type}`;
                fb.textContent = msg;
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function formatTime(ms) {
            const secs = Math.floor(ms / 1000);
            const mins = Math.floor(secs / 60);
            const s = secs % 60;
            return `${mins}:${s.toString().padStart(2, '0')}`;
        }

        function updateTimer() {
            if (game.startTime && !game.completed) {
                const elapsed = Date.now() - game.startTime;
                const timerEl = document.querySelector('.timer');
                if (timerEl) timerEl.textContent = formatTime(elapsed);
            }
        }

        setInterval(updateTimer, 1000);

        function render() {
            const level = levels[game.currentLevel];
            const energyPercent = (game.energy / level.maxEnergy) * 100;
            const elapsed = game.startTime ? Date.now() - game.startTime : 0;
            
            document.getElementById('app').innerHTML = `
                <div class="container">
                    <div class="header">
                        <h1>🥷 DESAFÍO DE LÓGICA PRO</h1>
                    </div>
                    
                    <div class="stats-header">
                        <div class="stat-box">
                            <div class="stat-label">Puntos Totales</div>
                            <div class="stat-number">${game.totalScore}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Tiempo</div>
                            <div class="stat-number timer">${formatTime(elapsed)}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Progreso</div>
                            <div class="stat-number">${game.currentLevel}/25</div>
                        </div>
                    </div>
                    
                    ${level.loopRequired ? '<div class="warning">🔒 BUCLE OBLIGATORIO: Sin bucle es IMPOSIBLE</div>' : ''}
                    
                    <div class="level-info">
                        <div class="level-header">
                            <div class="level-title">Nivel ${level.id}: ${level.name}</div>
                            <div class="energy-bar-container">
                                <div class="energy-bar" style="width: ${energyPercent}%">
                                    ⚡ ${game.energy}/${level.maxEnergy}
                                </div>
                            </div>
                        </div>
                        <div class="objective">
                            <h3>🎯 Objetivo (${level.points} pts):</h3>
                            <p>${level.objective}</p>
                        </div>
                    </div>
                    
                    <div class="game-grid" style="grid-template-columns: repeat(${level.grid}, 55px);">
                        ${renderGrid(level)}
                    </div>
                    
                    <div class="controls">
                        <div class="btn-control empty"></div>
                        <button class="btn-control" onclick="addCmd('A')">↑<br>A</button>
                        <div class="btn-control empty"></div>
                        <button class="btn-control" onclick="addCmd('I')">←<br>I</button>
                        <button class="btn-control" onclick="addCmd('B')">↓<br>B</button>
                        <button class="btn-control" onclick="addCmd('D')">→<br>D</button>
                    </div>
                    
                    <div class="command-area">
                        <textarea id="cmdInput" class="command-input" placeholder="Ejemplo: X5{D,B} o D D B B"></textarea>
                        <div class="help">
                            <h4>💡 Pista:</h4>
                            <div style="color: #ffd700;">${level.hint}</div>
                            ${level.loopRequired ? '<div style="color: #ff5555; margin-top: 10px;">⚡ Los bucles X{...} consumen MENOS energía</div>' : ''}
                        </div>
                        <button class="btn btn-run" onclick="run()">▶️ Ejecutar Código</button>
                        <button class="btn btn-reset" onclick="reset()">🔄 Reiniciar Nivel</button>
                        ${game.completed ? `<button class="btn btn-next" onclick="nextLevel()">➡️ Siguiente Nivel</button>` : ''}
                    </div>
                    
                    <div id="feedback" class="feedback"></div>
                    
                    <div class="stats">
                        <div class="stat-row"><span>💎 Gemas:</span><span class="stat-value">${game.gems.length}/${level.gems.length}</span></div>
                        <div class="stat-row"><span>⚡ Energía:</span><span class="stat-value">${game.energy}/${level.maxEnergy}</span></div>
                        <div class="stat-row"><span>🎯 Intentos:</span><span class="stat-value">${game.attempts}</span></div>
                    </div>
                </div>
            `;
        }

        function renderGrid(level) {
            let html = '';
            for (let y = 0; y < level.grid; y++) {
                for (let x = 0; x < level.grid; x++) {
                    let cls = 'cell', content = '';
                    
                    if (level.traps.some(t => t.x === x && t.y === y)) { 
                        cls += ' trap'; 
                        content = '🌀'; 
                    }
                    else if (level.goal.x === x && level.goal.y === y) { 
                        cls += ' goal'; 
                        content = '🎯'; 
                    }
                    
                    let hasGem = false;
                    for (let g = 0; g < level.gems.length; g++) {
                        if (level.gems[g].x === x && level.gems[g].y === y && !game.gems.includes(g)) {
                            hasGem = true;
                            break;
                        }
                    }
                    if (hasGem) content = '<span class="gem">💎</span>';
                    
                    if (game.pos.x === x && game.pos.y === y) content = '🥷';
                    
                    html += `<div class="${cls}">${content}</div>`;
                }
            }
            return html;
        }

        function addCmd(cmd) {
            const input = document.getElementById('cmdInput');
            if (input.value.length > 0) input.value += ' ';
            input.value += cmd;
        }

        function run() {
            const input = document.getElementById('cmdInput').value;
            if (!input.trim()) { 
                showFeedback('error', '⚠️ Escribe comandos primero'); 
                return; 
            }
            
            const parsed = parseCommands(input);
            if (parsed.length === 0) { 
                showFeedback('error', '⚠️ Comandos inválidos'); 
                return; 
            }
            
            executeCommands(parsed);
        }

        function reset() {
            const level = levels[game.currentLevel];
            generateRandomTraps(level);
            game.pos = {...level.start};
            game.gems = [];
            game.energy = level.maxEnergy;
            game.completed = false;
            render();
        }

        function nextLevel() {
            if (game.currentLevel < levels.length - 1) {
                game.currentLevel++;
                const level = levels[game.currentLevel];
                generateRandomTraps(level);
                game.pos = {...level.start};
                game.gems = [];
                game.energy = level.maxEnergy;
                game.completed = false;
                game.attempts = 0;
                render();
            } else {
                showFinalStats();
            }
        }

        function showFinalStats() {
            const totalTime = Date.now() - game.startTime;
            const avgScore = Math.floor(game.totalScore / 25);
            let rank = '';
            
            if (game.totalScore >= 30000) rank = '🏆 DIOS DE LA LÓGICA';
            else if (game.totalScore >= 25000) rank = '👑 LEYENDA';
            else if (game.totalScore >= 20000) rank = '⭐ MAESTRO';
            else if (game.totalScore >= 15000) rank = '🥇 EXPERTO';
            else if (game.totalScore >= 10000) rank = '🥈 AVANZADO';
            else rank = '🥉 APRENDIZ';
            
            document.getElementById('app').innerHTML = `
                <div class="container">
                    <div class="intro">
                        <h1>🏆 ¡JUEGO COMPLETADO!</h1>
                        <div class="rank">${rank}</div>
                        
                        <div class="final-stats">
                            <h2>📊 Estadísticas Finales</h2>
                            <div class="final-stat-row">
                                <span>Puntuación Total:</span>
                                <span style="color: #ffd700; font-size: 1.5em;">${game.totalScore} pts</span>
                            </div>
                            <div class="final-stat-row">
                                <span>Tiempo Total:</span>
                                <span style="color: #00ff88;">${formatTime(totalTime)}</span>
                            </div>
                            <div class="final-stat-row">
                                <span>Niveles Completados:</span>
                                <span style="color: #00d4ff;">25/25</span>
                            </div>
                            <div class="final-stat-row">
                                <span>Promedio por Nivel:</span>
                                <span style="color: #ffa500;">${avgScore} pts</span>
                            </div>
                        </div>
                        
                        <p style="font-size: 1.5em; margin: 30px 0;">
                            ¡Felicitaciones! Has dominado el arte de la programación lógica y los bucles.
                        </p>
                        
                        <button class="btn-start" onclick="location.reload()">🔄 Jugar de Nuevo</button>
                    </div>
                </div>
            `;
        }

        function showIntro() {
            document.getElementById('app').innerHTML = `
                <div class="container">
                    <div class="intro">
                        <h1>🥷 DESAFÍO DE LÓGICA PRO</h1>
                        <p style="font-size: 1.6em; color: #ffd700; margin: 20px 0;">25 NIVELES | SISTEMA DE PUNTOS | CRONÓMETRO</p>
                        
                        <ul>
                            <li>🎯 <strong>25 niveles progresivos</strong> de dificultad creciente</li>
                            <li>⚡ <strong>Sistema de puntos:</strong> Gana puntos por velocidad y eficiencia</li>
                            <li>⏱️ <strong>Cronómetro global:</strong> Completa todos los niveles lo más rápido posible</li>
                            <li>💎 <strong>Gemas obligatorias:</strong> Recoge todas para avanzar</li>
                            <li>🌀 <strong>Obstáculos aleatorios:</strong> Cambian en cada intento</li>
                            <li>🔒 <strong>Niveles 11-25:</strong> BUCLE OBLIGATORIO para completar</li>
                            <li>📊 <strong>Estadísticas finales:</strong> Ranking según tu desempeño</li>
                        </ul>
                        
                        <div style="background: rgba(255, 165, 0, 0.2); padding: 20px; border-radius: 10px; margin: 25px 0; border: 2px solid #ffa500;">
                            <h3 style="color: #ffa500; margin-bottom: 10px;">⚡ Sistema de Energía:</h3>
                            <p style="font-size: 1.1em;">• Comando simple (D) = 1 energía</p>
                            <p style="font-size: 1.1em;">• Bucle X5{D,B} = 5 energía (¡NO 10!)</p>
                            <p style="font-size: 1.1em; color: #ff5555; margin-top: 10px;">En niveles avanzados, SIN bucle es IMPOSIBLE ganar</p>
                        </div>
                        
                        <p style="font-size: 1.2em;"><strong>Controles:</strong> D=Derecha | I=Izquierda | A=Arriba | B=Abajo</p>
                        <p style="font-size: 1.2em;"><strong>Bucles:</strong> X5{D} = Repite 5 veces | X3{D,B} = Patrón 3 veces</p>
                        
                        <button class="btn-start" onclick="startGame()">🚀 COMENZAR DESAFÍO</button>
                    </div>
                </div>
            `;
        }

        function startGame() {
            game.currentLevel = 0;
            game.totalScore = 0;
            game.startTime = Date.now();
            game.attempts = 0;
            const level = levels[0];
            generateRandomTraps(level);
            game.pos = {...level.start};
            game.gems = [];
            game.energy = level.maxEnergy;
            game.completed = false;
            render();
        }

        showIntro();
    </script>
